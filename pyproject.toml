[tool.poetry]
name = "odss-engine-lib-pf"
version = "0.1.0"
description = ""
authors = ["Wan Darren <Wan.Darren@bcg.com>"]
readme = "README.md"
packages = [
    { include = "pf_engine" },
]


[[tool.poetry.source]]
name = "artifactory-pypi-repository"
url = "https://artifactory.cathaypacific.com/artifactory/api/pypi/py-common-dsp/simple"
priority = "primary"

[tool.poetry.dependencies]
python = "~3.11"
pytest = "^7.1.3"
pandas = "^1.4.4"
networkx = "^2.8.6"
mypy = "^0.971"
pydantic = "^2.5.3"
scipy = "1.11.2"
pytest-cov = "^3.0.0"
numpy = "1.23.5"
odss-domain-model-pf = "0.3.35+13.1249aa"
typer = {extras = ["all"], version = "^0.6.1"}
confuse = "^2.0.0"
python-dotenv = "^0.21.0"
numba = "0.57.1"
seaborn = "^0.13.0"
s3fs = "^2023.3.0"
fsspec = "^2023.3.0"
ortools = "^9.6.2534"
fastapi = "^0.120.0"
starlette = ">=0.49.1"
gurobipy = "10.0.0"
psutil = "^5.9.6"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
pre-commit = "^2.20.0"
pandas-stubs = "^1.5.2.230105"
black = "^22.8.0"
mccabe = "^0.7.0"
flake8 = "^5.0.4"
isort = "^6.0.0"
pydocstyle = "^6.3.0"
dagit = "^1.3.13"
nbconvert = "^7.14.1"

[tool.poetry.group.docs.dependencies]
sphinx = ">=4.2.0"
sphinx-book-theme = "*"
sphinx-rtd-theme = "^1.1.1"
sphinxcontrib-napoleon = "^0.7"
sphinxcontrib-mermaid = "^0.7.1"
myst-parser = "^0.18.1"

[tool.poetry.group.dagster.dependencies]
dagster = "^1.6"
dagster-aws = "^0.22"
dagster-postgres = "^0.22"
dagster-cloud = "^1.6"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.mypy]
exclude = [
    "tests",
]

[tool.pycodestyle]
convention = "google"
add-ignore = ["D100", "D104", "D107"]

[tool.pydocstyle]
convention = "google"
add_ignore = "D202"
match="^((?!tests).)*$"

[[tool.mypy.overrides]]
module = "gurobipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "domainmodel.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "confuse.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.dagster]
module_name = "pathfinder_engine_dagster_definition"
