name: Create Deploy Branch

permissions:
  contents: write

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        id: prepare
        uses: actions/github-script@v7
        with:
          retries: 5
          script: |
            // INPUT
            const env = '${{ inputs.env }}';
            const version = '${{ inputs.version }}';

            // BODY
            const { branch, ref } = await getHotfixBranchName(env, version);
            console.log({ branch, ref });
            core.setOutput('branch', branch);
            core.setOutput('ref', ref);

            async function getHotfixBranchName(env, version) {
             	if (isVersion(version)) {
            		const [date, merge] = version.split(".");
            		return { branch: `${env}-release-${date}.${merge}`, ref: version };
             	} else {
            		console.warn(`Usage of git sha for version is discouraged!`);
            		return { branch: `${env}-release-${version}`, ref: await getFullCommitSha(version) };
             	}
            }

            function isVersion(input) {
             	const regex = /^\d{8}\.\d+\.\d+$/;
             	return regex.test(input);
            }

            async function getFullCommitSha(shortSha) {
              console.log(`Fetching full commit SHA for: ${shortSha}`);
              const commit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: shortSha
              });

              return commit.data.sha;
            }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.prepare.outputs.ref }}
          sparse-checkout: |
            .gitignore

      - name: Create and push branch if it doesn't exist
        id: create-branch
        run: |
          # INPUT
          readonly BRANCH_NAME="${{ steps.prepare.outputs.branch }}"
          created="false"

          # BODY
          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            echo "Branch ${BRANCH_NAME} exists"
          else
            echo "Branch ${BRANCH_NAME} does not exist, creating new branch"
            git checkout -b "${BRANCH_NAME}"
            git push -u origin "${BRANCH_NAME}"
            created="true"
          fi

          # SUMMARY
          echo "## :arrow_heading_up: Branch Creation Summary" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Branch Name | Status | Action Taken |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|-------------|--------|--------------|" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${created}" == "true" ]]; then
            echo "| \`${{ steps.prepare.outputs.branch }}\` | ✅ Created | Branch created and pushed |" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "| \`${{ steps.prepare.outputs.branch }}\` | ⚠️ Exists | No action needed |" >> "${GITHUB_STEP_SUMMARY}"
          fi
